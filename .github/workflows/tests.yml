name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['10', '11', '12']
        include:
          - { laravel: '10', framework: '^10.0', testbench: '^8.0' }
          - { laravel: '11', framework: '^11.0', testbench: '^9.0' }
          - { laravel: '12', framework: '^12.0', testbench: '^10.0' }
          # Laravel 13 requires PHP 8.3+
          - { php: '8.3', laravel: '13', framework: '^13.0', testbench: '^11.0' }
          - { php: '8.4', laravel: '13', framework: '^13.0', testbench: '^11.0' }

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.framework }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
